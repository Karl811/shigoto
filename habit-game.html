  <style>
@font-face{font-family:'Roboto Flex';src:url('assets/fonts/roboto-flex-vietnamese.woff2') format('woff2');font-weight:100 1000;font-display:swap;unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB;}
@font-face{font-family:'Roboto Flex';src:url('assets/fonts/roboto-flex-latin.woff2') format('woff2');font-weight:100 1000;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}

    :root {
      --bg-page: #F6F5F0;
      --bg-table: #FAF9F5;
      --dot-color: #DFDDD4;
      --ink-primary: #18181B;
    }

    body {
      font-family: 'Roboto Flex', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--ink-primary);
      overscroll-behavior: none;
    }

    .font-mono-tag {
      font-family: ui-monospace, monospace;
      letter-spacing: 0.04em;
    }

    /* Mặt bàn Google Tabletop với họa tiết lưới chấm đặc trưng */
    .tabletop-surface {
      background-color: var(--bg-table);
      background-image: radial-gradient(var(--dot-color) 1.35px, transparent 1.35px);
      background-size: 20px 20px;
      box-shadow:
        0 24px 48px -16px rgba(24, 24, 27, 0.10),
        0 4px 12px -2px rgba(24, 24, 27, 0.04),
        inset 0 0 0 1px rgba(24, 24, 27, 0.07);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Thẻ / Khối vật lý Tabletop */
    .tt-widget {
      position: absolute;
      top: 0;
      left: 0;
      will-change: transform;
      pointer-events: none;
      box-shadow:
        0 3px 10px -2px rgba(24, 24, 27, 0.09),
        0 1px 2px rgba(24, 24, 27, 0.05);
      transition: box-shadow 0.16s ease, opacity 0.25s ease;
    }

    .tt-widget.is-grabbed {
      box-shadow:
        0 20px 32px -8px rgba(24, 24, 27, 0.24),
        0 8px 16px -4px rgba(24, 24, 27, 0.10),
        0 0 0 2px #18181B;
      z-index: 30;
    }

    /* Hiệu ứng rung lưới rổ khi ném lọt */
    @keyframes netSwish {
      0% { transform: scaleY(1) scaleX(1); }
      28% { transform: scaleY(1.28) scaleX(0.85); }
      62% { transform: scaleY(0.92) scaleX(1.06); }
      100% { transform: scaleY(1) scaleX(1); }
    }

    .net-swish-anim {
      transform-origin: top center;
      animation: netSwish 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Hiệu ứng hạt màu Tabletop khi ghi điểm */
    @keyframes confettiBurst {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(0.35) rotate(140deg);
      }
    }

    .tt-particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 3px;
      pointer-events: none;
      animation: confettiBurst 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Lớp bắt sự kiện kéo thả */
    #interaction-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
      cursor: grab;
      touch-action: none;
    }

    #interaction-layer:active {
      cursor: grabbing;
    }
  </style>
<style>html,body{margin:0;overscroll-behavior:contain}body{padding:12px!important;background:#F9F9FF}#court-wrapper{height:clamp(480px,70dvh,570px);border-radius:28px}#hud-banner{margin-bottom:10px}#hud-title,#hud-desc{white-space:normal;line-height:1.4}#hud-desc{font-size:12px}#selected-habits-list{max-height:none}.result14{padding:13px;border:1px solid #E0E4ED;border-radius:20px;background:#F9FAFF}.result14 b{font-size:16px;line-height:1.35}.result14 p{font-size:13px;line-height:1.5;margin:5px 0 8px;color:#525E70}.result14-actions{display:flex;flex-wrap:wrap;gap:6px}.result14 button{border:0;border-radius:22px;padding:10px 12px;min-height:44px;font-size:13px;font-weight:600;background:#E7EEFB;color:#204B88}.result14 button[data-action=choose]{background:#2265C5;color:white}.result14 button[data-action=return]{background:transparent;color:#687182}.result14-status{display:block;font-size:12px;color:#52714F;margin-bottom:7px}#empty-habits-msg{font-size:13px;line-height:1.5}#selected-count-badge{white-space:nowrap}#sound-toggle{min-width:44px;min-height:44px}#reset-btn,#toss-btn{min-height:44px}#court-wrapper{touch-action:none}#selected-habits-list{display:grid;gap:8px}button:focus-visible{outline:3px solid #2265C5;outline-offset:3px}@media(prefers-reduced-motion:reduce){.tt-particle{display:none}.net-swish-anim{animation:none}}</style>
<style>.game14-small-title{font-size:13px;line-height:1.4}#game14-results-jump{position:fixed;right:14px;bottom:14px;z-index:40;background:#2265C5;color:white;border:1px solid #fff6;border-radius:24px;min-height:44px;padding:10px 16px;font-size:14px;font-weight:600;box-shadow:0 3px 16px #183D702B}#game14-results-jump[hidden]{display:none}</style>

<body id="shinGame19" class="min-h-screen flex flex-col items-center py-5 px-3 sm:py-7 sm:px-4">

  <!-- Header mang phong cách Google CHƠI ĐỂ KHÁM PHÁ -->
  <header class="w-full max-w-[460px] flex items-center justify-between mb-3.5">
    <div class="flex items-center gap-2.5">
      <!-- Logo đa sắc 3D lấy cảm hứng từ Tabletop -->
      <svg class="w-9 h-9 shrink-0" viewBox="0 0 40 40" fill="none">
        <path d="M20 6L33 13.5L20 21L7 13.5L20 6Z" fill="#FBBF24"/>
        <path d="M7 13.5L20 21V34L7 26.5V13.5Z" fill="#60A5FA"/>
        <path d="M33 13.5L20 21V34L33 26.5V13.5Z" fill="#F472B6"/>
      </svg>
      <div>
        <b class="game14-small-title">14 thói quen<br>Tung thử nhé!</b>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="sound-toggle" type="button" class="px-3.5 py-2 rounded-full bg-white hover:bg-stone-50 active:scale-95 text-xs font-bold text-stone-800 border border-stone-200/90 shadow-xs flex items-center gap-1.5 transition cursor-pointer">
        <span id="sound-icon">🔊</span>
        <span class="hidden sm:inline">Âm thanh</span>
      </button>
      <button type="button" title="Xem gợi ý đã vào rổ" id="score-pill" class="px-3.5 py-2 rounded-full bg-stone-900 text-white text-xs font-extrabold shadow-xs">
        0 / 14
      </button>
    </div>
  </header>

  <!-- Khu vực chính -->
  <main class="w-full max-w-[460px] flex flex-col items-center">

    <!-- Thanh hiển thị chi tiết thói quen khi chạm vào thẻ -->
    <div id="hud-banner" class="w-full mb-3 px-4 py-2.5 rounded-[22px] bg-white border border-stone-200/80 shadow-xs flex items-center justify-between gap-3 min-h-[52px]">
      <div class="flex items-center gap-3 min-w-0">
        <span id="hud-badge" class="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0"></span>
        <div class="min-w-0">
          <div id="hud-title" class="text-xs sm:text-sm font-extrabold text-stone-900 truncate">
            Kéo & ném thẻ thói quen vào rổ phía trên
          </div>
          <div id="hud-desc" class="text-[11px] text-stone-500 truncate">
            Kéo một khối rồi thả tay để ném, hoặc bấm Tung lên.
          </div>
        </div>
      </div>
      <span id="hud-tag" class="font-mono-tag shrink-0 px-2 py-0.5 rounded-md bg-stone-100 text-stone-600 text-[10px] font-semibold uppercase">
        SHIN M3
      </span>
    </div>

    <!-- Mặt Bàn Vật Lý Google Tabletop + Rổ Bóng Rổ -->
    <div id="court-wrapper" class="relative w-full h-[500px] sm:h-[560px] rounded-[38px] tabletop-surface overflow-hidden">

      <!-- Nút Làm mới ở góc trên bên trái -->
      <button id="reset-btn" type="button" class="absolute top-4 left-4 z-30 px-3.5 py-2 rounded-full bg-white/95 hover:bg-white active:scale-95 text-xs font-bold text-stone-700 shadow-sm border border-stone-200/90 transition cursor-pointer flex items-center gap-1.5">
        <span>↺</span>
        <span>Xếp lại</span>
      </button>

      <!-- Nút Tung lên (Xáo trộn) chuẩn phong cách Tabletop ở góc trên bên phải -->
      <button id="toss-btn" type="button" class="absolute top-4 right-4 z-30 px-4 py-2 rounded-full bg-white/95 hover:bg-white active:scale-95 text-xs font-extrabold text-stone-900 shadow-sm border border-stone-200/90 transition cursor-pointer">
        Tung lên
      </button>

      <!-- LỚP 1 (Phía sau thẻ): Bảng rổ tối giản kiểu Tabletop -->
      <div id="hoop-backboard" class="absolute pointer-events-none z-[5] flex flex-col items-center justify-end" style="transform: translateX(-50%);">
        <div class="w-full h-full rounded-[22px] bg-white/90 backdrop-blur-xs border border-stone-300/90 shadow-xs flex flex-col items-center justify-end pb-2.5">
          <div class="font-mono-tag text-[9px] font-bold text-stone-400 uppercase tracking-widest mb-1">GOAL HOOP</div>
          <!-- Ô mục tiêu cam trên bảng rổ -->
          <div class="w-14 h-9 border-[2.5px] border-orange-500 rounded-md"></div>
        </div>
      </div>

      <!-- LỚP 2 (Giữa): 20 Thẻ Thói Quen Vật Lý -->
      <div id="items-container" class="absolute inset-0 z-[10] pointer-events-none"></div>

      <!-- LỚP 3 (Phía trước thẻ): Vành rổ & Lưới rổ -->
      <div id="hoop-foreground" class="absolute pointer-events-none z-[18] flex flex-col items-center" style="transform: translateX(-50%);">
        <div class="w-full h-3 rounded-full bg-gradient-to-r from-orange-600 via-orange-500 to-orange-600 shadow-sm border border-orange-700/30 relative">
          <span class="absolute -left-1 top-1/2 -translate-y-1/2 w-3.5 h-3.5 rounded-full bg-orange-600 border-2 border-white"></span>
          <span class="absolute -right-1 top-1/2 -translate-y-1/2 w-3.5 h-3.5 rounded-full bg-orange-600 border-2 border-white"></span>
        </div>
        <svg id="hoop-net-svg" class="w-[86%] h-14 -mt-0.5 overflow-visible" viewBox="0 0 100 56" preserveAspectRatio="none">
          <path d="M 4 2 L 18 52 L 82 52 L 96 2" fill="rgba(255,255,255,0.32)" stroke="#A8A29E" stroke-width="2" stroke-linejoin="round"/>
          <path d="M 16 2 L 32 52 M 36 2 L 50 52 M 64 2 L 50 52 M 84 2 L 68 52" stroke="#A8A29E" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M 10 18 L 90 18 M 14 35 L 86 35" stroke="#A8A29E" stroke-width="1.5" stroke-dasharray="4 3"/>
        </svg>
      </div>

      <!-- Lớp hạt hiệu ứng -->
      <div id="fx-layer" class="absolute inset-0 z-[22] pointer-events-none"></div>

      <!-- Lớp nhận tương tác kéo & ném -->
      <div id="interaction-layer"></div>
    </div>

    <!-- Danh Sách Thói Quen Đã Ném Trúng Rổ Để Rèn Luyện -->
    <section class="w-full mt-4 bg-white rounded-[30px] border border-stone-200/80 shadow-xs p-4 sm:p-5">
      <div class="flex items-center justify-between mb-3">
        <div>
          <h2 class="text-sm font-extrabold text-stone-900">Thói quen đã vào rổ</h2>
          <p class="text-[11px] text-stone-500">Xem rồi chọn điều phù hợp với mình.</p>
        </div>
        <span id="selected-count-badge" class="font-mono-tag px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-900 text-[11px] font-bold">
          0 GỢI Ý
        </span>
      </div>

      <!-- Trạng thái trống -->
      <div id="empty-habits-msg" class="py-6 px-4 rounded-2xl bg-[#FAF9F5] border border-dashed border-stone-200 text-center text-xs text-stone-400">
        Chưa có thẻ nào lọt vào rổ. Hãy kéo một thẻ bất kỳ và hất lên rổ để tìm một gợi ý!
      </div>

      <!-- Danh sách thẻ đã chọn -->
      <div id="selected-habits-list" class="grid grid-cols-1 gap-2 pr-0.5"></div>
    </section>

  </main>
  <button type="button" id="game14-results-jump" hidden aria-label="Xem thói quen đã vào rổ"></button>

  <script src="assets/game/habit-game.js?v=M3.3.20-5S.1"></script>
</body>
</html>
